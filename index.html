<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Valentine 💖</title>
  <style>
    body {
      background: linear-gradient(135deg, #ffd1dc, #ffe6eb);
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .box {
      background: white;
      padding: 35px 30px;
      border-radius: 24px;
      text-align: center;
      width: 320px;
      box-shadow: 0 15px 35px rgba(0,0,0,.25);
      position: relative;
      z-index: 2;
    }

    .photo {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 6px solid #ff4d6d;
      margin-bottom: 20px;
      animation: popIn 1s ease;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 26px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #ddd;
      position: absolute;
    }

    .yt-music {
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
    }

    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body onclick="unmuteMusic()">

  <!-- 🎵 YouTube autoplay MUTED -->
  <iframe
    id="ytPlayer"
    class="yt-music"
    src="https://www.youtube.com/embed/MppQlSeDk9g?start=20&autoplay=1&loop=1&playlist=MppQlSeDk9g&mute=1"
    frameborder="0"
    allow="autoplay">
  </iframe>

  <div class="box">
    <img src="us.png" class="photo" alt="Us 💕">

    <h1>Will you be my Valentine? 💝</h1>

    <button id="yes" onclick="yesClick()">Yes</button>
    <button id="no" onmouseover="runAway()">No</button>
  </div>

  <script>
    let unmuted = false;

    function unmuteMusic() {
      if (!unmuted) {
        const yt = document.getElementById("ytPlayer");
        yt.src =
          "https://www.youtube.com/embed/MppQlSeDk9g" +
          "?start=20&autoplay=1&loop=1&playlist=MppQlSeDk9g";
        unmuted = true;
      }
    }

    function runAway() {
      unmuteMusic();

      const noBtn = document.getElementById("no");
      const yesBtn = document.getElementById("yes");

      const x = Math.random() * 220 - 110;
      const y = Math.random() * 180 - 90;

      noBtn.style.transform = `translate(${x}px, ${y}px)`;

      yesBtn.style.transform = `scale(${1.2})`;
    }

    function yesClick() {
      document.body.innerHTML = `
        <div style="
          background:#ffe6eb;
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          font-family:Arial;
          text-align:center;
          padding:20px;
        ">
          <h1 style="color:#ff4d6d;">
            Thanks Babe, sabi ko na G ka eh. 💕<br><br>
            I love you!! ❤️<br><br>
            – Bry
          </h1>
        </div>
      `;
    }
  </script>

</body>
</html>
