<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine 💖</title>
  <style>
    body {
      background: #ffe6eb;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,.2);
    }
    button {
      padding: 12px 24px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .yes { background: #ff4d6d; color: white; }
    .no { background: #ccc; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Will you be my Valentine? 💕</h1>
    <button class="yes" onclick="alert('Yay! 💖')">Yes</button>
    <button class="no">No</button>
  </div>
</body>
</html>
